<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Now</title>
  <link rel="stylesheet" href="app.css">
  <!-- The SDK first, as a classic script, so window.deska exists before app.js runs. -->
  <script src="/__deska/sdk.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="app" aria-busy="true">
    <section class="view" id="now-view" aria-labelledby="place-name">
      <header class="bar">
        <div class="place">
          <h1 id="place-name">Weather</h1>
          <p class="secondary" id="place-region"></p>
        </div>
        <div class="units" role="group" aria-label="Units">
          <button type="button" class="quiet" id="unit-metric" aria-pressed="false" aria-label="Celsius">°C</button>
          <button type="button" class="quiet" id="unit-imperial" aria-pressed="false" aria-label="Fahrenheit">°F</button>
        </div>
        <button type="button" class="quiet" id="open-places">Places</button>
      </header>

      <div class="body" id="body"></div>

      <footer class="foot">
        <p class="secondary" id="updated" role="status"></p>
        <button type="button" class="link" id="retry" hidden>Retry</button>
        <button type="button" class="link attribution" id="attribution">Weather data by Open-Meteo.com</button>
      </footer>
    </section>

    <section class="view" id="places-view" aria-labelledby="places-title" hidden>
      <header class="bar">
        <h1 id="places-title">Places</h1>
        <button type="button" class="quiet" id="close-places">Done</button>
      </header>

      <!-- form-action is 'none' in a panel: app.js handles submit itself. -->
      <form class="search" id="search" role="search">
        <label class="sr-only" for="query">Search for a city</label>
        <input id="query" type="search" placeholder="Search for a city" autocomplete="off" spellcheck="false"
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results">
      </form>
      <ul class="results" id="results" role="listbox" aria-label="Search results" hidden></ul>
      <p class="secondary search-status" id="search-status" role="status"></p>

      <h2 class="caption" id="saved-title">Saved</h2>
      <ul class="saved" id="saved" aria-labelledby="saved-title"></ul>
    </section>
  </main>
</body>
</html>
