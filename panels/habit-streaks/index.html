<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habit Streaks</title>
    <link rel="stylesheet" href="app.css" />
    <script src="/__deska/sdk.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="head">
      <div class="head-text">
        <h1 id="date" class="date">Today</h1>
        <p id="summary" class="summary"></p>
      </div>
      <button id="add" class="quiet" type="button" hidden>
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Add
      </button>
    </header>

    <main id="main" class="main" aria-busy="true">
      <p class="state">Loading habits…</p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <section id="storage" class="drawer" aria-label="What this panel stores" hidden></section>
    <section id="archived" class="drawer" aria-label="Archived habits" hidden></section>
    <footer id="foot" class="foot" hidden>
      <button id="storage-toggle" class="quiet small" type="button" aria-expanded="false" aria-controls="storage">Storage</button>
      <button id="archived-toggle" class="quiet small" type="button" aria-expanded="false" aria-controls="archived" hidden></button>
    </footer>
  </body>
</html>
